# Local PostgreSQL for development. Start with `npm run db:up`.
# Data persists in the `cv-db-data` volume; `npm run db:down` keeps it,
# `docker compose down -v` deletes it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvbank-local}
      POSTGRES_DB: ${POSTGRES_DB:-cvbank}
    ports:
      # Loopback only: the database holds personal data and must not be reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cv-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  cv-db-data:
