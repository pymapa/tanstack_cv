# Static dependency analysis (spec §9.1 A03). Fails when a dependency has a critical advisory.
# `pnpm verify` locally is stricter (--audit-level=high); CI blocks on critical.
name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so advisories published after merge are caught too (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-audit:
    name: pnpm audit (critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Checks pnpm-lock.yaml against the advisory database; nothing is installed or run.
      - name: Report all advisories
        run: pnpm audit || true
      - name: Fail on critical advisories
        run: pnpm audit --audit-level=critical

  dependency-review:
    name: Dependency review (critical)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Blocks a PR that adds or updates a dependency to a version with a critical advisory.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
